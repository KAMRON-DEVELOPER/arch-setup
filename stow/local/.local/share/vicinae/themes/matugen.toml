# Vicinae Matugen Theme Template
# Used LLM for initial generation, then modified to a satisfactory level

[meta]
name = "Matugen"
description = "Material You theme generated by Matugen - dark variant"
variant = "dark"

# ============================================================================
# Core Colors
# ============================================================================

[colors.core]
accent = "#cabeff"
accent_foreground = "#31285f"
background = "#141318"
foreground = "#e6e1e9"
secondary_background = "#201f25"
border = "#48454e"

# ============================================================================
# Window Borders
# ============================================================================

[colors.main_window]
border = "#48454e"

[colors.settings_window]
border = "#938f99"

# ============================================================================
# Accent Palette
# ============================================================================

[colors.accents]
blue = "#cabeff"
green = "#edb8cc"
magenta = "#c9c3dc"
orange = { name = "#ffb4ab", lighter = 40 }
red = "#ffb4ab"
yellow = { name = "#edb8cc", lighter = 80 }
cyan = { name = "#cabeff", lighter = 50 }
purple = "#c9c3dc"

# ============================================================================
# Text System
# ============================================================================

[colors.text]
default = "#e6e1e9"
muted = "#c9c4d0"
danger = "#ffb4ab"
success = "#edb8cc"
placeholder = { name = "#c9c4d0", opacity = 0.6 }

[colors.text.selection]
background = "#cabeff"
foreground = "#31285f"

[colors.text.links]
default = "#cabeff"
visited = { name = "#edb8cc", darker = 20 }

# ============================================================================
# Input Fields
# ============================================================================

[colors.input]
border = "#938f99"
border_focus = "#cabeff"
border_error = "#ffb4ab"

# ============================================================================
# Buttons
# ============================================================================

[colors.button.primary]
background = "#2b292f"
foreground = "#e6e1e9"

[colors.button.primary.hover]
background = "#36343a"  

[colors.button.primary.focus]
outline = "#cabeff"

# ============================================================================
# Lists
# ============================================================================

[colors.list.item.hover]
background = { name = "#483f77", opacity = 0.25 }  
foreground = "#e6e1e9"

[colors.list.item.selection]
background = { name = "#483f77", opacity = 0.50 }
foreground = "#e6deff"
secondary_background = "#483f77"
secondary_foreground = "#e6deff"

# ============================================================================
# Grid Items
# ============================================================================

[colors.grid.item]
background = "#201f25"

[colors.grid.item.hover]
outline = { name = "#c9c3dc", opacity = 0.8 }

[colors.grid.item.selection]
outline = { name = "#cabeff" }

# ============================================================================
# Scrollbars
# ============================================================================

[colors.scrollbars]
background = { name = "#cabeff", opacity = 0.2 }

# ============================================================================
# Loading States
# ============================================================================

[colors.loading]
bar = "#cabeff"
spinner = "#cabeff"
