# Vicinae Matugen Theme Template
# Used LLM for initial generation, then modified to a satisfactory level

[meta]
name = "Matugen"
description = "Material You theme generated by Matugen - dark variant"
variant = "dark"

# ============================================================================
# Core Colors
# ============================================================================

[colors.core]
accent = "#93cdf6"
accent_foreground = "#00344c"
background = "#101417"
foreground = "#dfe3e7"
secondary_background = "#1c2024"
border = "#41484d"

# ============================================================================
# Window Borders
# ============================================================================

[colors.main_window]
border = "#41484d"

[colors.settings_window]
border = "#8b9198"

# ============================================================================
# Accent Palette
# ============================================================================

[colors.accents]
blue = "#93cdf6"
green = "#cdc0e9"
magenta = "#b6c9d8"
orange = { name = "#ffb4ab", lighter = 40 }
red = "#ffb4ab"
yellow = { name = "#cdc0e9", lighter = 80 }
cyan = { name = "#93cdf6", lighter = 50 }
purple = "#b6c9d8"

# ============================================================================
# Text System
# ============================================================================

[colors.text]
default = "#dfe3e7"
muted = "#c1c7ce"
danger = "#ffb4ab"
success = "#cdc0e9"
placeholder = { name = "#c1c7ce", opacity = 0.6 }

[colors.text.selection]
background = "#93cdf6"
foreground = "#00344c"

[colors.text.links]
default = "#93cdf6"
visited = { name = "#cdc0e9", darker = 20 }

# ============================================================================
# Input Fields
# ============================================================================

[colors.input]
border = "#8b9198"
border_focus = "#93cdf6"
border_error = "#ffb4ab"

# ============================================================================
# Buttons
# ============================================================================

[colors.button.primary]
background = "#262a2e"
foreground = "#dfe3e7"

[colors.button.primary.hover]
background = "#313539"  

[colors.button.primary.focus]
outline = "#93cdf6"

# ============================================================================
# Lists
# ============================================================================

[colors.list.item.hover]
background = { name = "#004c6d", opacity = 0.25 }  
foreground = "#dfe3e7"

[colors.list.item.selection]
background = { name = "#004c6d", opacity = 0.50 }
foreground = "#c7e7ff"
secondary_background = "#004c6d"
secondary_foreground = "#c7e7ff"

# ============================================================================
# Grid Items
# ============================================================================

[colors.grid.item]
background = "#1c2024"

[colors.grid.item.hover]
outline = { name = "#b6c9d8", opacity = 0.8 }

[colors.grid.item.selection]
outline = { name = "#93cdf6" }

# ============================================================================
# Scrollbars
# ============================================================================

[colors.scrollbars]
background = { name = "#93cdf6", opacity = 0.2 }

# ============================================================================
# Loading States
# ============================================================================

[colors.loading]
bar = "#93cdf6"
spinner = "#93cdf6"
