# Vicinae Matugen Theme Template
# Used LLM for initial generation, then modified to a satisfactory level

[meta]
name = "Matugen"
description = "Material You theme generated by Matugen - dark variant"
variant = "dark"

# ============================================================================
# Core Colors
# ============================================================================

[colors.core]
accent = "#9ad4a1"
accent_foreground = "#003916"
background = "#101510"
foreground = "#dfe4dc"
secondary_background = "#1c211c"
border = "#414941"

# ============================================================================
# Window Borders
# ============================================================================

[colors.main_window]
border = "#414941"

[colors.settings_window]
border = "#8b9389"

# ============================================================================
# Accent Palette
# ============================================================================

[colors.accents]
blue = "#9ad4a1"
green = "#a1ced7"
magenta = "#b7ccb6"
orange = { name = "#ffb4ab", lighter = 40 }
red = "#ffb4ab"
yellow = { name = "#a1ced7", lighter = 80 }
cyan = { name = "#9ad4a1", lighter = 50 }
purple = "#b7ccb6"

# ============================================================================
# Text System
# ============================================================================

[colors.text]
default = "#dfe4dc"
muted = "#c1c9be"
danger = "#ffb4ab"
success = "#a1ced7"
placeholder = { name = "#c1c9be", opacity = 0.6 }

[colors.text.selection]
background = "#9ad4a1"
foreground = "#003916"

[colors.text.links]
default = "#9ad4a1"
visited = { name = "#a1ced7", darker = 20 }

# ============================================================================
# Input Fields
# ============================================================================

[colors.input]
border = "#8b9389"
border_focus = "#9ad4a1"
border_error = "#ffb4ab"

# ============================================================================
# Buttons
# ============================================================================

[colors.button.primary]
background = "#262b26"
foreground = "#dfe4dc"

[colors.button.primary.hover]
background = "#313631"  

[colors.button.primary.focus]
outline = "#9ad4a1"

# ============================================================================
# Lists
# ============================================================================

[colors.list.item.hover]
background = { name = "#1a512a", opacity = 0.25 }  
foreground = "#dfe4dc"

[colors.list.item.selection]
background = { name = "#1a512a", opacity = 0.50 }
foreground = "#b6f1bc"
secondary_background = "#1a512a"
secondary_foreground = "#b6f1bc"

# ============================================================================
# Grid Items
# ============================================================================

[colors.grid.item]
background = "#1c211c"

[colors.grid.item.hover]
outline = { name = "#b7ccb6", opacity = 0.8 }

[colors.grid.item.selection]
outline = { name = "#9ad4a1" }

# ============================================================================
# Scrollbars
# ============================================================================

[colors.scrollbars]
background = { name = "#9ad4a1", opacity = 0.2 }

# ============================================================================
# Loading States
# ============================================================================

[colors.loading]
bar = "#9ad4a1"
spinner = "#9ad4a1"
